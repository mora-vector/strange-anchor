<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strange Anchor // Deep Forest Layout Array</title>
    <style>
        body {
            background-color: #0f141d;
            color: #4cd3c2;
            font-family: 'Courier New', monospace;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 900px;
            border-bottom: 1px dashed #ff2a74;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .meta-text {
            color: #d2e4e1;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        svg {
            border: 1px solid rgba(76, 211, 194, 0.3);
            background-color: #0b0e14;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.05);
        }
        .grid-line {
            stroke: rgba(76, 211, 194, 0.1);
            stroke-width: 1;
        }
        .bismuth-hull {
            stroke: #4cd3c2;
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 5, 5;
        }
        .mycelium-path {
            stroke: #ff2a74;
            stroke-width: 1.5;
            fill: none;
            opacity: 0.75;
        }
        .forest-node {
            fill: #00f0ff;
            cursor: pointer;
            transition: r 0.2s;
        }
        .forest-node:hover {
            r: 8;
            fill: #ff2a74;
        }
        .legend {
            margin-top: 1.5rem;
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
        }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 1.2rem; text-transform: uppercase;">📡 Array: Forest-Grid-Topology // FoxCoded</div>
        <div class="meta-text">Locus: Core Sector Gamma // Hardware Map Linked to Memory Register 0x004F</div>
    </div>

    <!-- Generative SVG Structural Blueprint -->
    <svg width="900" height="500" viewBox="0 0 900 500">
        <!-- Structural coordinate system grid backdrop -->
        <g id="coordinate-grid">
            <script>
                const svg = document.currentScript.parentElement;
                for(let i = 50; i < 900; i += 50) {
                    let line = document.createElementNS("http://w3.org", "line");
                    line.setAttribute("x1", i); line.setAttribute("y1", 0);
                    line.setAttribute("x2", i); line.setAttribute("y2", 500);
                    line.setAttribute("class", "grid-line");
                    svg.appendChild(line);
                }
                for(let j = 50; j < 500; j += 50) {
                    let line = document.createElementNS("http://w3.org", "line");
                    line.setAttribute("x1", 0); line.setAttribute("y1", j);
                    line.setAttribute("x2", 900); line.setAttribute("y2", j);
                    line.setAttribute("class", "grid-line");
                    svg.appendChild(line);
                }
            </script>
        </g>

        <!-- Outer Bismuth Alloy Clinker Hull Vectors -->
        <path class="bismuth-hull" d="M 50,250 Q 250,50 450,50 Q 650,50 850,250 Q 650,450 450,450 Q 250,450 50,250 Z" />

        <!-- Overlapping Clinker Plates (Warped Grid Offsets) -->
        <path stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" fill="none" d="M 150,250 Q 300,120 450,120 Q 600,120 750,250" />
        <path stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" fill="none" d="M 150,250 Q 300,380 450,380 Q 600,380 750,250" />

        <!-- Distributed Mycelial Growth Arrays (The Cook's Thread Network) -->
        <path class="mycelium-path" d="M 120,250 C 200,200 350,180 420,220 S 550,300 680,240 S 740,260 800,250" />
        <path class="mycelium-path" d="M 450,50 C 430,150 380,250 420,320 S 490,400 450,450" />

        <!-- Living Core Structural Botany Nodes (Un-serialized Mass Intersections) -->
        <!-- Node 1: The Root Root -->
        <circle class="forest-node" cx="220" cy="190" r="5" />
        <text x="232" y="194" fill="#d2e4e1" font-size="10">धातु-मूलम् (0x7F2)</text>

        <!-- Node 2: Lopa Expansion Chamber -->
        <circle class="forest-node" cx="420" cy="220" r="6" fill="#ff2a74" />
        <text x="432" y="215" fill="#ff2a74" font-size="10" font-weight="bold">लोपसूची-केन्द्रम् (0x04F)</text>

        <!-- Node 3: The Pitch Stratum Well -->
        <circle class="forest-node" cx="610" cy="290" r="5" />
        <text x="622" y="294" fill="#d2e4e1" font-size="10">स्वर-कूपः (0x39A)</text>
    </svg>

    <div class="legend">
        <div class="legend-item"><span style="color: #4cd3c2;">--</span> Bismuth Hull Boundary</div>
        <div class="legend-item"><span style="color: #ff2a74;">--</span> Mycelial Distribution Network</div>
        <div class="legend-item"><span style="color: #00f0ff;">●</span> Active Relational Graph Intersection</div>
    </div>

</body>
</html>
