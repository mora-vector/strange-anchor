name: Validate Sandhi
on:
  pull_request:
    paths:
      - 'nix/sandhi/**'
      - '.github/workflows/sandhi.yml'
      - '!nix/sandhi/evidence/**'
      - '!nix/sandhi/docs/**'
      - '!nix/sandhi/README.md'
      - '!nix/sandhi/VALIDATION.json'
  push:
    branches: [main]
    paths:
      - 'nix/sandhi/**'
      - '.github/workflows/sandhi.yml'
      - '!nix/sandhi/evidence/**'
      - '!nix/sandhi/docs/**'
      - '!nix/sandhi/README.md'
      - '!nix/sandhi/VALIDATION.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandhi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24
        with:
          persist-credentials: false
      - name: Check evidence recorder behavior
        run: python3 -m unittest discover -s nix/sandhi/tests -p 'test_recorder.py' -v
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-system-features = nixos-test
      - name: Evaluate and exercise generated service boundaries
        run: python3 nix/sandhi/scripts/realize.py --output-dir "$RUNNER_TEMP/sandhi-run"
      - name: Preserve this run's evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          archive: true
          name: sandhi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sandhi-run/*.json
            ${{ runner.temp }}/sandhi-run/*.stdout
            ${{ runner.temp }}/sandhi-run/*.stderr
          if-no-files-found: warn
          retention-days: 30
