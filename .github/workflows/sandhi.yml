name: Validate Sandhi
on:
  pull_request:
    paths: ['nix/sandhi/**', '.github/workflows/sandhi.yml']
  push:
    branches: [main]
    paths: ['nix/sandhi/**', '.github/workflows/sandhi.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandhi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-system-features = nixos-test
      - name: Evaluate and exercise generated service boundaries
        run: python3 nix/sandhi/scripts/realize.py --output-dir "$RUNNER_TEMP/sandhi-run"
      - name: Preserve this run's evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandhi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sandhi-run/*.json
            ${{ runner.temp }}/sandhi-run/*.stdout
            ${{ runner.temp }}/sandhi-run/*.stderr
          if-no-files-found: warn
          retention-days: 30
