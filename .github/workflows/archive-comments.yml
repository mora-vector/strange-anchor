name: Preserve conversation comments
on:
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # issue_comment runs trusted default-branch code. Never check out a PR head.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24
      - run: python3 scripts/archive_event.py
      # No shared concurrency group: pending events must not replace one another.
      # The publisher retries non-force pushes after competing archive writes.
